# Automatische Prüfung bei jedem Push und Pull Request (Audit, Block 2).
# Läuft unter Windows wie die Entwicklung, damit Testergebnisse vergleichbar
# sind. Analyse schlägt nur bei Fehlern fehl; Hinweise und Warnungen sind
# derzeit eine bekannte Baseline.
name: CI

on:
  push:
    branches:
      - main
      - 'lead/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyse und Tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - name: Pakete holen
        run: flutter pub get

      - name: Analyse (nur Fehler brechen ab)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test
