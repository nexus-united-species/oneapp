name: "🐞 Fehler melden / Report a bug"
description: "Etwas funktioniert nicht wie erwartet. / Something does not work as expected."
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **🇩🇪** Danke, dass du hilfst, die OneApp besser zu machen! Bitte keine Seed-Phrasen, privaten Schlüssel oder persönlichen Daten in Logs oder Screenshots. **Sicherheitslücken bitte nicht hier melden**, sondern wie in der [Sicherheitsrichtlinie](https://github.com/nexus-united-species/.github/blob/main/SECURITY.md) beschrieben.

        **🇬🇧** Thank you for helping to improve the OneApp! Please never include seed phrases, private keys or personal data in logs or screenshots. **Do not report security vulnerabilities here** – follow the [security policy](https://github.com/nexus-united-species/.github/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: "Was ist passiert? / What happened?"
      description: "Was hast du erwartet, und was ist stattdessen passiert? / What did you expect, and what happened instead?"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Schritte zum Nachvollziehen / Steps to reproduce"
      placeholder: |
        1. Öffne … / Open …
        2. Tippe auf … / Tap …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "App-Version / App version"
      placeholder: "z. B. / e.g. v0.2.0-alpha"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: "Plattform / Platform"
      multiple: true
      options:
        - Android
        - Windows
        - "Andere / Other"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: "Gerät und Betriebssystem / Device and OS"
      placeholder: "z. B. / e.g. Pixel 7, Android 15 – Windows 11"
  - type: dropdown
    id: area
    attributes:
      label: "Bereich / Area"
      options:
        - "Identität & Backup / Identity & backup"
        - "Chat & Kanäle / Chat & channels"
        - "Kontakte / Contacts"
        - "Zellen / Cells"
        - "Dorfplatz / Village square"
        - "Governance & Abstimmungen / Governance & voting"
        - "Transport (Nostr, LAN, BLE)"
        - "Installation & Updates"
        - "Sonstiges / Other"
  - type: textarea
    id: logs
    attributes:
      label: "Logs oder Screenshots / Logs or screenshots"
      description: "Optional. Bitte vorher persönliche Daten entfernen. / Optional. Please remove personal data first."
      render: shell
